name: Build TUI Executables

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Install native packages for every target platform
      run: bun install --os="*" --cpu="*"

    - name: Test
      run: bun run test

    - name: Build TUI binaries
      run: bun run --cwd tui build --all

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tui-binaries
        path: tui/dist/*
        retention-days: 30

    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: tui/dist/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
