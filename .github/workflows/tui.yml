name: Build TUI Executables

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Check the tag matches tui/package.json
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        v="v$(jq -r .version tui/package.json)"
        [ "$GITHUB_REF_NAME" = "$v" ] || { echo "Tag $GITHUB_REF_NAME does not match tui/package.json ($v)"; exit 1; }

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Install native packages for every target platform
      run: bun install --os="*" --cpu="*"

    - name: Test
      run: bun run test

    - name: Build TUI binaries
      run: bun run --cwd tui build --all

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: tui-binaries
        path: tui/dist/*
        retention-days: 30

    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        files: tui/dist/*
        # Notes come from .github/release-notes/<tag>.md.
        body_path: .github/release-notes/${{ github.ref_name }}.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
