name: Build and Release Extension

on:
  push:
    tags:
      - 'ext-v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: extension

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: extension/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Bump version (if manual trigger)
      if: github.event_name == 'workflow_dispatch'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        npm run version:${{ github.event.inputs.version_type }}
        
    - name: Build extension
      run: |
        # Copy only what the extension needs (exclude.txt is xcopy syntax, which rsync doesn't understand)
        rm -rf dist && mkdir -p dist
        cp -r manifest.json popup.html css js icons dist/
        
    - name: Get version from package.json
      id: package-version
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

    - name: Check the tag and manifest.json match package.json
      run: |
        v="${{ steps.package-version.outputs.version }}"
        [ "$(node -p "require('./manifest.json').version")" = "$v" ] || { echo "manifest.json version differs from package.json ($v)"; exit 1; }
        if [ "${{ github.event_name }}" = "push" ] && [ "$GITHUB_REF_NAME" != "ext-v$v" ]; then
          echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1
        fi
      
    - name: Create extension package
      run: |
        cd dist
        zip -r ../mydy-extension-v${{ steps.package-version.outputs.version }}.zip .

    # A manual run bumps the version: commit and tag it first, so the release tag points at the bumped source.
    - name: Commit and tag version bump (if manual trigger)
      if: github.event_name == 'workflow_dispatch'
      run: |
        git add package.json manifest.json
        git commit -m "Bump extension to v${{ steps.package-version.outputs.version }}"
        git tag ext-v${{ steps.package-version.outputs.version }}
        git push origin HEAD:main
        git push origin ext-v${{ steps.package-version.outputs.version }}
        
    # Notes come from .github/release-notes/ext-v<version>.md (an empty body if that file is missing).
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ext-v${{ steps.package-version.outputs.version }}
        name: MyDy Downloader v${{ steps.package-version.outputs.version }}
        body_path: .github/release-notes/ext-v${{ steps.package-version.outputs.version }}.md
        files: extension/mydy-extension-v${{ steps.package-version.outputs.version }}.zip
        make_latest: false
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
