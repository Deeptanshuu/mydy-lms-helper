name: Test

on:
  pull_request:

# Runs code from forks, so it gets no write access and no secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Test
      run: bun run test

    - name: Typecheck
      run: bun run typecheck
